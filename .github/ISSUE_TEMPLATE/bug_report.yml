name: Bug report
description: Report a reproducible problem in Claude of Duty.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Do not include secrets or unlicensed assets.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Press ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome 140 on Windows 11
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Console output or visual evidence
      description: Paste relevant text or attach a current screenshot/recording. Remove private data first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials and private information from this report.
          required: true
